automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Fadell–Neuwirth is proved for Hausdorff topological manifolds modelled on a finite-dimensional real
    normed space (more generally for Hausdorff spaces with local point-pushing homeomorphisms); the
    left-exactness (injectivity of π₁ of the fibre) is proved unconditionally for Hausdorff spaces
    admitting a surjective covering map from a space embedding openly in ℂ (plane domains, complex
    tori, once-punctured elliptic curves as quotients ℂ/Λ ∖ {0}); for other surfaces (e.g. compact
    of genus ≥ 2, abstract Riemann surfaces) the uniformising covering must be supplied, since
    general uniformisation is not formalised, and in general it is stated under the hypothesis
    π₂(Conf n X) = 0. The étale version is not formalised beyond the Galois-theoretic surjectivity
    criterion (functoriality of π₁ᵉᵗ, connected objects of FEt, EGA IV 2.4.6 and SGA 1 X/XIII are
    missing). Configuration schemes are defined for separated
    S-schemes (so that the partial diagonals are closed); field-valued points are described for reduced
    one-point S-schemes.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    Statements were checked against Fadell–Neuwirth (1962) by the agent.

