    Topological layer complete (configuration spaces, symmetric-group action, forgetful maps and
    fibres, Serre-fibration property of locally trivial maps, fundamental-group sequence, Fadell–Neuwirth
    fibration and exact sequence for manifolds); algebraic layer in progress; étale sequence not formalised.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Conf.isLocallyTrivial_forget"
      file: "ConfigurationSpaces/Topology/FadellNeuwirth.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "Conf.fadellNeuwirth_range_eq_ker"
      file: "ConfigurationSpaces/Topology/FadellNeuwirth.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "Conf.fadellNeuwirth_surjective"
      file: "ConfigurationSpaces/Topology/FadellNeuwirth.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "Conf.fadellNeuwirth_injective"
      file: "ConfigurationSpaces/Topology/FadellNeuwirth.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "IsLocallyTrivial.exists_lift_homotopy"
      file: "ConfigurationSpaces/Topology/CubeLifting.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "FundamentalGroup.ker_map_eq_range_map_fiberIncl"
      file: "ConfigurationSpaces/Topology/FundamentalGroupSequence.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "FundamentalGroup.map_fiberIncl_injective"
      file: "ConfigurationSpaces/Topology/FundamentalGroupSequence.lean"
