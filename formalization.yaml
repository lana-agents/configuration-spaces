version: "v0.4"

project:
  name: "configuration-spaces"
  description: >-
    Planned Lean 4 / Mathlib formalization of ordered configuration spaces of curves
    Conf_n(X) = Xⁿ minus the pairwise diagonals: the symmetric-group action, the forgetful maps
    Conf_{n+1}(X) → Conf_n(X), their fibres as punctured curves, and the resulting topological and étale
    fundamental-group exact sequences (including the Fadell–Neuwirth sequence), with the functoriality needed
    by anabelian reconstruction arguments (Topics in Absolute Anabelian Geometry II).
    The topological layer is complete: configuration spaces, symmetric-group action, forgetful maps
    and fibres, homotopy lifting for locally trivial maps, the fundamental-group sequence of a
    locally trivial map, and the Fadell–Neuwirth fibration and exact sequence for manifolds. The
    algebraic layer provides configuration schemes of separated S-schemes (open subschemes of fibre
    powers), the symmetric-group action, forgetful morphisms, Conf_{n+1} as an open subscheme of
    Conf_n ×_S X, and field-valued points. Second homotopy groups: pi_2 vanishes for open subsets
    of C (via the Koebe plane uniformisation theorem of lana-agents/oka) and for spaces covered by
    them, and pi_2(Conf_n X) = 0 for such surfaces, giving the short exact Fadell–Neuwirth sequence
    for plane domains, complex tori and once-punctured elliptic curves. The étale sequence is not
    formalised; only the Galois-theoretic surjectivity criterion (SGA 1 V.6.9) is.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Configuration spaces"
    authors: ["Edward Fadell", "Lee Neuwirth"]
    type: "article"
    note: "1962. Local triviality of the forgetful maps and the fundamental-group sequence (Conf.isLocallyTrivial_forget, Conf.fadellNeuwirth_*)."
  - title: "Revêtements étales et groupe fondamental (SGA 1)"
    authors: ["Alexander Grothendieck"]
    type: "book"
    note: "Reference for the étale theory; the étale homotopy exact sequence is not formalised."
  - title: "The algebraic and anabelian geometry of configuration spaces"
    authors: ["Shinichi Mochizuki", "Akio Tamagawa"]
    type: "article"
    location: "Hokkaido Math. J. 37 (2008), 75-131"
    note: "Reference for configuration spaces of curves (configuration schemes, ConfScheme); the anabelian results are not formalised."

related_formalizations:
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Intended as an input to the anabelian machinery of iut; not used by it."
  - id: "https://github.com/lana-agents/oka"
    relationship: "other"
    note: "Dependency (pinned at 043c179): the plane uniformisation theorem (Koebe iteration, Uniformization.PlaneData.exists_covering) and the modular covering used for pi_2 of plane domains."
  - id: "https://github.com/lana-agents/belyi"
    relationship: "other"
    note: "Separate from the Belyi-map existence theorem formalised there."

